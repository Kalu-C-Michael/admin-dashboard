<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css"/>
    <title>Admin Dashboard</title>
</head>
<body>
    <aside>
        <div class="dashboard">
            <img src="assets/view-dashboard-outline.svg" alt="dashboard" />  
            <h2>Dashboard</h2>
        </div>
        <div class="navigation">
            <img src="assets/home-outline.svg" alt="home" srcset="">
            <p>Home</p>
            <img src="assets/account-circle-outline.svg" alt="" srcset="">
            <p>Profile</p>
            <img src="assets/message-outline.svg" alt="" srcset="">
            <p>Messages</p>
            <img src="assets/history.svg" alt="" srcset="">
            <p>History</p>
            <img src="assets/calendar-check-outline.svg" alt="" srcset="">
            <p>Tasks</p>
            <img src="assets/city-variant-outline.svg" alt="" srcset="">
            <p>Communities</p>
        </div>
        <div class="settings">
            <img src="assets/cog-outline.svg" alt="">
            <p>Settings</p>
            <img src="assets/face-agent.svg" alt="">
            <p>Support</p>
            <img src="assets/shield-check-outline.svg" alt="">
            <p>Privacy</p>
        </div>
    </aside>
    <header>
        <div class='search-bar'>
            <label for="#search"><img src="assets/magnify.svg" alt="search icon">
            <input type="text" name="search-bar" id="search">            
            </label>
            <img src="assets/bell-badge-outline.svg" alt="">
            <img id="pain" src="assets/crying-wojak.png" alt="pain">
            <p>javaScript Victim</p>
        </div>
        <div class='user-info'>
            <span>
             <img id="pain2" src="assets/crying-wojak.png" alt="pain">
             <p>
                Hi there,<br>
                I'm javaScript Victim(Help Me!)
             </p> 
            </span>
           <div class="buttons">
            <button>New</button>
            <button>Upload</button>
            <button>Share</button>
           </div>
            
        </div>
    </header>
    <main>
        <section class="projects-container">
            <p>Your Projects</p>
            <div class="projects">
                <div></div>
                <div></div>
                <div></div>
                <div></div>
                <div></div>
                <div></div>
            </div>
        </section>
        <section class="announcements-container">
            <p>Announcements</p>
            <div class="announcements"></div>
        </section>
        <section class="trending-container">
            <p>Trending</p>
            <div class="trending"></div>
        </section>
    </main>
</body>
</html>
